# System and Experiment
experiment = "Segmentation"
seed = 42
num_workers = 4

# Data Configuration
split_filename = "segmentation"
num_folds = 4

# Training Settings
num_epochs = 50
batch_size = 16

# Model Architecture
[model]
name = "UNet"

[model.parameters]
in_channels = 1
num_classes = 3

# Optimizer
[optimizer]
name = "Adam"

[optimizer.parameters]
lr = 1e-4

# Loss Function
[loss]
name = "DiceCELoss"

[loss.parameters]
num_classes = 3

# Metric
[metric]
name = "mIoU"

[metric.parameters]
num_classes = 3
